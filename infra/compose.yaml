name: audiotool

services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-audiotool}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-audiotool-development-only}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-audiotool}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-audiotool-development-only}
    entrypoint:
      - /bin/sh
      - -c
      - >-
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing local/audiotool
    restart: "no"

  postgres:
    image: postgres:18-alpine
    profiles: ["isolated-postgres"]
    environment:
      POSTGRES_DB: audio_tool_compose
      POSTGRES_USER: audiotool
      POSTGRES_PASSWORD: ${COMPOSE_POSTGRES_PASSWORD:-audiotool-development-only}
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audiotool -d audio_tool_compose"]
      interval: 5s
      timeout: 3s
      retries: 20

  ml-worker:
    profiles: ["real-ml"]
    build:
      context: ..
      dockerfile: infra/docker/ml-worker.Dockerfile
    environment:
      AUDIOTOOL_ML_MODEL: ${AUDIOTOOL_ML_MODEL:-htdemucs_6s}
      AUDIOTOOL_ML_VOCAL_MODEL: ${AUDIOTOOL_ML_VOCAL_MODEL:-htdemucs_ft}
      AUDIOTOOL_ML_CACHE_ROOT: /app/ml-cache
      AUDIOTOOL_ML_TIMEOUT_SECONDS: ${AUDIOTOOL_ML_TIMEOUT_SECONDS:-1800}
      AUDIOTOOL_ML_CONCURRENCY: ${AUDIOTOOL_ML_CONCURRENCY:-1}
      AUDIOTOOL_ML_SHIFTS: ${AUDIOTOOL_ML_SHIFTS:-0}
    ports:
      - "8000:8000"
    volumes:
      - ml-worker-cache:/app/ml-cache
      - demucs-model-cache:/root/.cache/huggingface
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)",
        ]
      interval: 10s
      timeout: 6s
      retries: 12
    restart: unless-stopped

volumes:
  redis-data:
  minio-data:
  postgres-data:
  ml-worker-cache:
  demucs-model-cache:
