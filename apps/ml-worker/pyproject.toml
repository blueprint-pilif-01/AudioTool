[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "audiotool-ml-worker"
version = "0.1.0"
description = "Local HTTP adapter for real AudioTool source separation providers"
requires-python = ">=3.10,<3.15"
dependencies = [
  "demucs==4.1.0",
  "edge-tts==7.2.8",
  "fastapi==0.139.0",
  "numpy>=1.26,<3",
  "soundfile==0.14.0",
  "uvicorn[standard]==0.51.0",
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pytest>=8.4,<9", "ruff>=0.12,<1"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
